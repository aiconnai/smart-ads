name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  try-local:
    name: Try local MacBook pytest
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'aiconnai/smart-ads'
      && (github.event_name == 'push'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.draft == false))
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    outputs:
      outcome: ${{ steps.route.outputs.outcome }}
      run_url: ${{ steps.route.outputs.run_url }}
    steps:
      - name: Dispatch and monitor bounded local pytest
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          router_file="$RUNNER_TEMP/local_pytest_router.py"
          if ! gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/tools/ci/local_pytest_router.py?ref=$CI_BASE_SHA" \
            > "$router_file" 2>/dev/null || [[ ! -s "$router_file" ]]; then
            echo 'Local MacBook pytest router is not on the trusted base yet; using ubuntu-latest fallback'
            printf 'outcome=fallback\nrun_url=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exec python3 -I "$router_file"

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    needs: [try-local]
    if: ${{ !cancelled() }}
    steps:
      - name: Report local MacBook pytest result
        if: needs.try-local.outputs.outcome == 'success' || needs.try-local.outputs.outcome == 'test-failed'
        env:
          LOCAL_OUTCOME: ${{ needs.try-local.outputs.outcome }}
          LOCAL_RUN_URL: ${{ needs.try-local.outputs.run_url }}
        run: |
          printf 'Local MacBook pytest: %s (%s)\n' "$LOCAL_OUTCOME" "$LOCAL_RUN_URL"
          if [[ "$LOCAL_OUTCOME" == "test-failed" ]]; then
            exit 1
          fi
      - uses: actions/checkout@v4
        if: needs.try-local.outputs.outcome != 'success' && needs.try-local.outputs.outcome != 'test-failed'
      - uses: actions/setup-python@v5
        if: needs.try-local.outputs.outcome != 'success' && needs.try-local.outputs.outcome != 'test-failed'
        with:
          # Decomposition AST identity is pinned to the actual CPython 3.12 ABI.
          python-version: '3.12'
      - name: Generate hash-pinned Linux requirements from uv.lock
        if: needs.try-local.outputs.outcome != 'success' && needs.try-local.outputs.outcome != 'test-failed'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          lock = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          windows_markers = {"os_name == 'nt'", "sys_platform == 'win32'"}

          assert pyproject["project"]["dependencies"] == []
          build_requires = set(pyproject["build-system"]["requires"])
          dev_group = set(pyproject["dependency-groups"]["dev"])
          assert build_requires and build_requires.issubset(dev_group)

          packages = {pkg["name"]: pkg for pkg in lock["package"]}
          assert len(packages) == len(lock["package"])
          root = packages["smart-ads"]
          assert root.get("source") == {"editable": "."}
          locked_dev = {
              f"{d['name']}{d['specifier']}"
              for d in root["metadata"]["requires-dev"]["dev"]
          }
          assert dev_group == locked_dev

          for name, pkg in packages.items():
              if pkg.get("source") == {"editable": "."}:
                  continue
              wheels = pkg.get("wheels", [])
              assert wheels, f"Missing wheels for {name}"
              for w in wheels:
                  assert re.fullmatch(r"sha256:[0-9a-f]{64}", w.get("hash", ""))

          queue = [
              d["name"]
              for d in root["dev-dependencies"]["dev"]
              if d.get("marker") not in windows_markers
          ]
          selected: set[str] = set()
          while queue:
              curr = queue.pop()
              if curr in selected:
                  continue
              pkg = packages[curr]
              if pkg.get("source") == {"editable": "."}:
                  continue
              selected.add(curr)
              for dep in pkg.get("dependencies", []):
                  if dep.get("marker") not in windows_markers:
                      queue.append(dep["name"])

          lines = []
          for name in sorted(selected):
              pkg = packages[name]
              hashes = sorted({w["hash"] for w in pkg["wheels"]})
              lines.append(f"{name}=={pkg['version']} " + " ".join(f"--hash={h}" for h in hashes))

          Path("/tmp/ci-locked-dev.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Install hash-pinned test and build dependencies
        if: needs.try-local.outputs.outcome != 'success' && needs.try-local.outputs.outcome != 'test-failed'
        run: python3 -m pip install --no-deps --require-hashes -r /tmp/ci-locked-dev.txt
      - name: Run tests
        if: needs.try-local.outputs.outcome != 'success' && needs.try-local.outputs.outcome != 'test-failed'
        run: python3 -m pytest -q -W error -p no:cacheprovider
