name: pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Decomposition AST identity is pinned to the actual CPython 3.12 ABI.
          python-version: '3.12'
      - name: Install test and build dependencies
        run: python3 -m pip install --upgrade pip hatchling==1.33.0 build==1.6.1 pytest==9.2.0
      - name: Run tests
        run: python3 -m pytest -q -p no:cacheprovider
