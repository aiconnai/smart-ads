[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "smart-ads"
version = "0.1.0"
description = "Smart Ads Read Gateway core contracts, registry domain, and zero-I/O ProviderPort (ADR-0001)."
requires-python = ">=3.12"
dependencies = []
license-files = []

[dependency-groups]
dev = [
  "build==1.6.1",
  "hatchling==1.33.0",
  "pytest==9.2.0",
]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
only-include = ["src/smart_ads"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src/smart_ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
